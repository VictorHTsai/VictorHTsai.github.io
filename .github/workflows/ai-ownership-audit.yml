name: Daily SEC 13F release audit
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official SEC release availability
        run: python ai-institutional-ownership/scripts/check_sec.py
      - name: Commit refreshed source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-institutional-ownership/data/latest.json
          git diff --cached --quiet || (git commit -m "Update SEC 13F source audit metadata" && git push)
